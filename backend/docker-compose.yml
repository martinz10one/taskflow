services:
  frontend:
    build:
      context: ../taskflow-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CLIENT_URL=http://localhost:8080
      - MONGO_URI=mongodb://mongoserver:27017/taskflow
      - REDIS_URL=redis://redisserver:6379
    depends_on:
      - mongoserver
      - redisserver

  worker:
    build: .
    command: ["npm", "run", "worker"]
    environment:
      - MONGO_URI=mongodb://mongoserver:27017/taskflow
      - REDIS_URL=redis://redisserver:6379
    depends_on:
      - mongoserver
      - redisserver

  mongoserver:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  redisserver:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  mongo-data: